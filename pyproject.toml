[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "notification-mcp"
version = "0.1.0"
description = "Local MCP notification service with configurable delivery channels and a durable queue"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.26,<2",
  "httpx>=0.28,<0.29",
  "pydantic>=2.11,<3",
  "starlette>=0.40,<2",
  "uvicorn>=0.34,<1",
]

[project.scripts]
notification-mcp = "notification_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
