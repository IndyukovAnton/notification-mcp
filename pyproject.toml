[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "notification-mcp-relay"
version = "0.3.0"
description = "Local MCP notification service with configurable delivery channels and a durable queue"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anton Indyukov" }]
keywords = ["mcp", "notifications", "telegram", "codex"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Communications",
]
dependencies = [
  "mcp>=1.26,<2",
  "httpx>=0.28,<0.29",
  "pydantic>=2.11,<3",
  "starlette>=0.40,<2",
  "uvicorn>=0.34,<1",
]

[project.scripts]
notification-mcp = "notification_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/IndyukovAnton/notification-mcp"
Repository = "https://github.com/IndyukovAnton/notification-mcp"
Issues = "https://github.com/IndyukovAnton/notification-mcp/issues"
Author = "https://github.com/IndyukovAnton"

[tool.hatch.build.targets.wheel]
packages = ["src/notification_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "tests/",
  "docs/",
  "scripts/",
  ".github/",
  "README.md",
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "config.example.toml",
  "config.local.example.toml",
  "install.ps1",
]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
