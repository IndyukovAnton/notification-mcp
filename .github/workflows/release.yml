name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(uv version --short)"
          test "$GITHUB_REF_NAME" = "v$package_version"
      - run: uv build
      - name: Smoke-test built wheel
        shell: bash
        run: |
          uv venv --python 3.11 .release-venv
          uv pip install --python .release-venv/bin/python dist/*.whl
          .release-venv/bin/notification-mcp --version
          .release-venv/bin/notification-mcp client-config json --token-env \
            | grep -F '"TELEGRAM_BOT_TOKEN": "<PASTE_TELEGRAM_BOT_TOKEN_HERE>"'
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
